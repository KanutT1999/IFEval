# Single source of truth for what gets measured.
# Every run's manifest.json copies the resolved entries it used from here.

generation:
  dtype: float16            # V100 has no bf16; kept fp16 on every GPU so runs are comparable across hardware
  max_new_tokens: 1280      # same budget as lm-evaluation-harness ifeval task
  max_model_len: 4096       # prompt + output; bounds the KV cache
  gpu_memory_utilization: 0.90
  hf_batch_size: 32         # only used by the transformers fallback backend
  sampling:                 # only for the deliberate variance experiment
    temperature: 0.7
    top_p: 0.95
  # Llama 3.x chat templates insert "Today Date: <today>" unless date_string is
  # given -> the prompt would change with the calendar. Pin it.
  chat_template_kwargs:
    date_string: "26 Jul 2024"

# Hardware profiles override `generation` above. Selected by HW_PROFILE, or
# automatically: GPU with < 12 GB VRAM -> rtx_8gb, otherwise v100.
# Every run's manifest records the profile and the resolved generation settings.
hardware_profiles:
  v100: {}
  rtx_8gb:                  # e.g. RTX 3070 Ti 8 GB, incl. WSL2 (display takes ~0.5-1 GB)
    max_model_len: 2048     # IFEval prompts are < 400 tokens; 2048 still fits prompt + 1280 output
    gpu_memory_utilization: 0.90
    enforce_eager: true     # no CUDA graphs: frees ~0.5-1 GB for KV cache on small cards
    hf_batch_size: 8

