model_sets:
  v100_16gb: [qwen2.5-0.5b, qwen2.5-1.5b, qwen2.5-3b, smollm2-1.7b, llama3.2-1b, llama3.2-3b]
  v100_32gb: [qwen2.5-0.5b, qwen2.5-1.5b, qwen2.5-3b, qwen2.5-7b, smollm2-1.7b, llama3.2-1b, llama3.2-3b]
  # 8 GB cards: 3B models are last because they are tight (fp16 weights ~6.2-6.4 GB);
  # if one does not fit, run_all logs it and moves on.
  rtx_8gb: [qwen2.5-0.5b, qwen2.5-1.5b, smollm2-1.7b, llama3.2-1b, qwen2.5-3b, llama3.2-3b]
  rtx_8gb_open: [qwen2.5-0.5b, qwen2.5-1.5b, smollm2-1.7b, qwen2.5-3b]
  open_only: [qwen2.5-0.5b, qwen2.5-1.5b, qwen2.5-3b, smollm2-1.7b]
  local_test: [qwen2.5-0.5b]

# Prompt variants. "plain" is the canonical path (prompt verbatim as the single
# user turn, the model's own chat template). The next three are
# meaning-preserving rewordings of the wrapper. "no_template" is an ablation.
variants:
  plain:          {system: null, user: "{prompt}", chat_template: true}
  sys_helpful:    {system: "You are a helpful assistant.", user: "{prompt}", chat_template: true}
  prefix_please:  {system: null, user: "Please respond to the following request.\n\n{prompt}", chat_template: true}
  labelled:       {system: null, user: "Request:\n{prompt}", chat_template: true}
  no_template:    {system: null, user: "{prompt}", chat_template: false}

# A condition = variant + decoding (+ seeds).
# order_seed permutes the order prompts are submitted (changes batch makeup,
# which is the main source of fp16 non-determinism under greedy decoding).
conditions:
  greedy_plain_r0:      {variant: plain, decoding: greedy, order_seed: 0}
  greedy_plain_r1:      {variant: plain, decoding: greedy, order_seed: 1}
  greedy_plain_r2:      {variant: plain, decoding: greedy, order_seed: 2}
  greedy_sys_helpful:   {variant: sys_helpful, decoding: greedy, order_seed: 0}
  greedy_prefix_please: {variant: prefix_please, decoding: greedy, order_seed: 0}
  greedy_labelled:      {variant: labelled, decoding: greedy, order_seed: 0}
  greedy_no_template:   {variant: no_template, decoding: greedy, order_seed: 0}
  sample_plain_s0:      {variant: plain, decoding: sample, seed: 0, order_seed: 0}
  sample_plain_s1:      {variant: plain, decoding: sample, seed: 1, order_seed: 0}
  sample_plain_s2:      {variant: plain, decoding: sample, seed: 2, order_seed: 0}
  sample_plain_s3:      {variant: plain, decoding: sample, seed: 3, order_seed: 0}
  sample_plain_s4:      {variant: plain, decoding: sample, seed: 4, order_seed: 0}

headline_condition: greedy_plain_r0
repeat_conditions: [greedy_plain_r0, greedy_plain_r1, greedy_plain_r2]
rewording_conditions: [greedy_plain_r0, greedy_sys_helpful, greedy_prefix_please, greedy_labelled]
sampling_conditions: [sample_plain_s0, sample_plain_s1, sample_plain_s2, sample_plain_s3, sample_plain_s4]

# Phases are run phase-major (all models phase 1, then all models phase 2...)
# so that if the GPU budget runs out, every model already has its headline.
phases:
  "1": [greedy_plain_r0]
  "2": [greedy_plain_r1, greedy_plain_r2, greedy_sys_helpful, greedy_prefix_please, greedy_labelled]
  "3": [greedy_no_template, sample_plain_s0, sample_plain_s1, sample_plain_s2, sample_plain_s3, sample_plain_s4]

# Zhou et al. 2023, arXiv:2311.07911 v1, Table 3 (percent).
# Responses collected via API: GPT-4 Nov 2023, PaLM 2 S Aug 2023.
# The paper does not state decoding settings.
paper:
  GPT-4:    {prompt_strict: 76.89, inst_strict: 83.57, prompt_loose: 79.30, inst_loose: 85.37}
  PaLM 2 S: {prompt_strict: 43.07, inst_strict: 55.76, prompt_loose: 46.95, inst_loose: 59.11}
